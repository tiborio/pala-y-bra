html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:var(--tex);background-size:360px 360px;min-height:100vh;color:var(--tx);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:480px;padding:18px 20px 56px;text-align:center}
.hrules{position:fixed;top:12px;right:14px;z-index:5;width:46px;height:46px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);font-weight:800;font-size:20px;color:var(--br)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#nav{display:block}
.tab{flex:1;max-width:84px;min-height:54px;border:1.5px solid var(--ln);background:var(--sf);border-radius:14px;font-weight:800;font-size:15px;line-height:1.15;padding:4px}
.tab.on{border-color:var(--br);background:var(--bg)}
.tab.done{background:var(--ac);color:#16213e;border-color:var(--ac)}
.tab small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.tab.done small{color:#16213e}
.tab small.ck{font-size:17px;line-height:1;font-weight:900;margin-top:1px}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:18px;margin:44px 0 12px;font-size:68px;font-weight:900;letter-spacing:.02em;color:var(--br);line-height:1}
.pill{display:inline-block;padding:4px 16px;border-radius:99px;background:var(--sf);font-weight:700;color:var(--br);transition:background .4s,color .4s}.pill.gold{background:var(--ac);color:#16213e}
.bar{height:8px;background:var(--sf);border-radius:9px;margin:20px auto 0;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
#inp{margin:44px auto 8px;max-width:420px;min-height:60px;padding:12px 4px;background:none;border-bottom:3px solid var(--ac);font-size:30px;font-weight:800;letter-spacing:.12em;word-break:break-all}
#inp.ph{color:var(--mu);font-size:19px;font-weight:600;letter-spacing:.08em}
#inp b{color:var(--ac)}
details{margin:16px 0;border:0;background:var(--sf);border-radius:16px;padding:14px 18px;text-align:left}
summary{cursor:pointer;font-weight:700;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.home{display:flex;flex-direction:column;align-items:center;gap:34px;padding:clamp(36px,10vh,96px) 4px 32px}
.home svg{width:min(360px,100%);height:auto;display:block}
.home h1{margin:0;font-size:clamp(40px,12vw,56px);line-height:1;font-weight:900;letter-spacing:-.01em;color:var(--br)}
.home h1 i{font-style:normal;color:var(--ac)}
.home .tag{margin:-10px 0 0;color:var(--mu);font-size:18px;text-wrap:balance;max-width:22ch}
.home .today{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.home .today span{padding:6px 12px;border-radius:99px;border:2px solid var(--ln);font-weight:800;letter-spacing:.08em;color:var(--br)}
.home .daily{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px}
.home .daily .btn{margin:2px 0 0}
.home .st{margin:0;color:var(--mu);font-size:14px}
.home .menu{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.home .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 12px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);font-weight:800;font-size:14px}
.home .tile small{font-weight:600;font-size:11px;color:var(--mu)}
.home .tile em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--br);margin-top:4px}
.home .tile svg{width:26px;height:26px;margin:0 0 4px;stroke:var(--br);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;align-items:center;gap:12px;margin:-18px -20px 0;padding:14px 20px;border-bottom:1px solid var(--ln);text-align:left}
.hd b{font-weight:800;font-size:15px;white-space:nowrap}
.bdg{font-style:normal;flex:none;min-width:28px;height:28px;padding:0 7px;border-radius:99px;background:var(--ac);color:#16213e;font-weight:800;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sg{flex:1;display:flex;gap:4px}.sg span{flex:1;height:8px;border-radius:9px;background:var(--sf);overflow:hidden}.sg u{display:block;height:100%;background:var(--ac);transition:width .4s}

let d=new Date();if(Q.has('fecha')){const t=Q.get('fecha').split('-').map(Number);if(t.length==3&&t.every(Number.isFinite))d=new Date(t[0],t[1]-1,t[2])}

 fs.forEach(f=>{P[f.k]=[];const U=new Set(f.u?f.u.toUpperCase().split(' '):[]);for(const b of['c','m','r'])if(f[b])f[b].split(' ').forEach(x=>{const w=x.toUpperCase(),R=b=='r'&&!U.has(w),o={w,n:w,r:R,b,p:(w.length-3)*(R?2:1),k:f.k};D.set(w,o);P[f.k].push(o)})})}

save=()=>{if(!arch)S.l=1;fix();try{localStorage.setItem(SK+':'+DK,JSON.stringify(S))}catch(e){}};

function digSpot(){const W=innerWidth,H=innerHeight,R=[...document.querySelectorAll('#app *,.hrules,#dig .dg')].filter(e=>{const c=e.getBoundingClientRect();return c.width>2&&c.height>2&&c.bottom>0&&c.top<H&&(!e.children.length||e.matches('.hd,.nr,.sg,button,details,.pair,.bar,.pill,#inp,.insight,.kp,.hl,.chips,.rr,.tc,svg,.tile,.ar,.arcbar,.seg'))}).map(e=>e.getBoundingClientRect());
 for(const w of [140,118,98,80,64]){const h=w*.7,pad=6;let best=null,free=[];
  for(let i=0;i<400;i++){const x=Math.random()*(W-w),y=Math.random()*(H-h);let o=0;
   for(const c of R){const ox=Math.min(x+w+pad,c.right)-Math.max(x-pad,c.left),oy=Math.min(y+h+pad,c.bottom)-Math.max(y-pad,c.top);if(ox>0&&oy>0)o+=ox*oy}
   if(o==0)free.push([x,y]);else if(!best||o<best.o)best={x,y,o}}
  if(free.length){const f=free[Math.random()*free.length|0];return{x:f[0],y:f[1],w}}
  if(w==64&&best)return{x:best.x,y:best.y,w}}
 return{x:0,y:0,w:64}}

function sub(){const r=S.r[v],k=picks[v],w=cur;let m='';
 if(w.length<4)m='Mínimo 4 letras';
 else if(w[0]!=k[0]||w[w.length-1]!=k[2])m=`Debe empezar con ${k[0]} y terminar con ${k[2]}`;

 else if(!D.has(w)){m='No está en el diccionario';missW=w;const q=$('#rp');if(q)q.innerHTML=`<button class="rep" onclick="report(missW)">¿Es válida? Avísame de «${w}»</button>`}
 if(m){const e=$('#inp');if(e){e.classList.remove('sh');void e.offsetWidth;e.classList.add('sh')}return toast(m)}
 r.f.push(w);cur='';toast('+'+D.get(w).p+' pts'+(D.get(w).r?' ✦':''));const RW=D.get(w).r;if(RW)dig();

function key(c){if(home||arcv||lsv){if(home&&c=='ENTER')play();return}if(v>2||S.r[v].x)return;if(c=='ENTER')sub();else if(c=='BACK'){cur=cur.slice(0,-1);inp()}else if(cur.length<20){cur+=c;inp()}}
