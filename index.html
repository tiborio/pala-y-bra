<style>
:root{--bg:#eef1f7;--sf:#e2e7f1;--tx:#16213e;--mu:#5d6784;--br:#1b4965;--ac:#e8a200;--ln:#c9d1e3;--kb:#c3cce0;--ok:#1f8a5b;--soil:#2b3a55;--soil2:#41557a;--steel:#9db0cb;--steel2:#6b7f9e;--hi:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--sf:#1b2232;--tx:#e9edf7;--mu:#98a3bf;--br:#8cc4e8;--ac:#f5b82e;--ln:#2d364b;--kb:#323c55;--ok:#4cc38a;--soil:#0b0f18;--soil2:#232c40;--steel:#7088aa;--steel2:#50658a;--hi:#c9d6ea}}
:root[data-theme="dark"]{--bg:#10151f;--sf:#1b2232;--tx:#e9edf7;--mu:#98a3bf;--br:#8cc4e8;--ac:#f5b82e;--ln:#2d364b;--kb:#323c55;--ok:#4cc38a;--soil:#0b0f18;--soil2:#232c40;--steel:#7088aa;--steel2:#50658a;--hi:#c9d6ea}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:520px;padding:12px 14px 24px;text-align:center}
.hrules{position:absolute;top:12px;right:14px;width:46px;height:46px;border-radius:12px;border:2px solid var(--ln);background:var(--sf);font-weight:800;font-size:20px;color:var(--br)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#nav{display:flex;gap:6px;justify-content:center}
.tab{flex:1;max-width:84px;min-height:52px;border:2px solid var(--ln);background:var(--sf);border-radius:12px;font-weight:800;font-size:15px;line-height:1.15;padding:4px}
.tab.on{border-color:var(--br);background:var(--bg)}
.tab.done{background:var(--ac);color:#16213e;border-color:var(--ac)}
.tab small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.tab.done small{color:#16213e}
.tab small.ck{font-size:17px;line-height:1;font-weight:900;margin-top:1px}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:22px 0 6px;font-size:64px;font-weight:900;letter-spacing:.02em;color:var(--br);line-height:1}
.arch{width:84px;height:34px;border:5px dotted var(--ac);border-bottom:0;border-radius:90px 90px 0 0;margin-bottom:14px}
.pill{display:inline-block;padding:3px 14px;border-radius:99px;background:var(--sf);font-weight:700;color:var(--br)}
.bar{height:8px;background:var(--sf);border-radius:9px;margin:10px auto 0;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
#inp{margin:22px auto 14px;max-width:420px;min-height:60px;padding:12px;background:var(--sf);border-bottom:4px solid var(--ac);font-size:30px;font-weight:800;letter-spacing:.12em;word-break:break-all}
#inp.ph{color:var(--mu);font-size:19px;font-weight:600;letter-spacing:.08em}
#inp b{color:var(--ac)}
details{margin:10px 0;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;text-align:left}
summary{cursor:pointer;font-weight:700;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.home{display:flex;flex-direction:column;align-items:center;gap:26px;padding:clamp(28px,9vh,84px) 4px 24px}
.home svg{width:min(360px,100%);height:auto;display:block}
.home h1{margin:0;font-size:clamp(40px,12vw,56px);line-height:1;font-weight:900;letter-spacing:-.01em;color:var(--br)}
.home h1 i{font-style:normal;color:var(--ac)}
.home .tag{margin:-10px 0 0;color:var(--mu);font-size:18px;text-wrap:balance;max-width:22ch}
.home .today{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.home .today span{padding:6px 12px;border-radius:99px;border:2px solid var(--ln);font-weight:800;letter-spacing:.08em;color:var(--br)}
.home .daily{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px}
.home .daily .btn{margin:2px 0 0}
.home .st{margin:0;color:var(--mu);font-size:14px}
.home .menu{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.home .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 12px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);font-weight:800;font-size:14px}
.home .tile small{font-weight:600;font-size:11px;color:var(--mu)}
.home .tile em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--br);margin-top:4px}
.home .tile svg{width:26px;height:26px;margin:0 0 4px;stroke:var(--br);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.ho{flex:0 0 46px}
.sub{margin:0 0 6px;color:var(--mu)}
.insight{background:var(--sf);border-radius:14px;padding:14px 16px;text-align:left;margin:14px 0}
.insight p{margin:0 0 8px}.insight p:last-child{margin:0}
.rr{display:grid;grid-template-columns:44px 1fr 78px;gap:10px;align-items:center;margin:8px 0;font-weight:700;color:var(--br)}
.rr .bar{margin:0;max-width:none}
.rr span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}
.home .date{color:var(--mu);font-size:14px}.home .date::first-letter{text-transform:uppercase}.home .link{margin-top:-10px}
.chip{padding:6px 12px;border-radius:8px;background:var(--sf);font-weight:700;letter-spacing:.04em}
.chip.r{background:var(--ac);color:#16213e}
#kb{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:5px;justify-content:center}
.k{flex:1;max-width:44px;height:52px;border:0;border-radius:8px;background:var(--kb);font-weight:800;font-size:17px}
.k.w{max-width:66px;font-size:12px;background:var(--br);color:var(--bg)}
.link{background:none;border:0;color:var(--mu);text-decoration:underline;margin-top:14px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#16213e;font-weight:800;font-size:18px;margin:14px 0}
.msg{color:var(--mu);margin:18px 0 4px}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hl div{background:var(--sf);border-radius:12px;padding:10px 4px;font-weight:800;color:var(--br);word-break:break-word;font-size:14px}
.hl small{display:block;color:var(--mu);font-weight:600;font-size:11px;margin-bottom:4px}
.seg{display:flex;gap:6px;margin:14px 0}
.seg i{flex:1;height:14px;border-radius:9px;background:var(--sf)}
.seg i.on{background:var(--ok)}
.rs{display:flex;justify-content:space-between;background:var(--sf);border-radius:12px;padding:12px 14px;margin:6px 0;font-weight:700;text-align:left}
.rs small{display:block;color:var(--mu);font-weight:500;text-align:right}
h2{margin:6px 0;font-size:34px;color:var(--br)}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#t.s{opacity:1}
#m{position:fixed;inset:0;background:rgba(10,14,25,.6);display:none;align-items:center;justify-content:center;padding:16px}
#m.open{display:flex}
#m>div{background:var(--bg);border-radius:18px;width:100%;max-width:400px;padding:26px 22px 20px;position:relative;min-height:300px;display:flex;flex-direction:column}
#m h3{font-size:26px;margin:14px 0 8px;color:var(--br)}
#m p{margin:0;font-size:17px}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--sf)}
.nv{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:20px}
.nv button{min-width:48px;height:48px;border-radius:24px;border:2px solid var(--ln);background:var(--sf);font-size:20px;padding:0 16px}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ln);margin:0 3px}
.dots i.on{background:var(--br)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="nav"></div><main id="v"></main></div>
<div id="t" role="status"></div>
<div id="m" role="dialog" aria-modal="true"><div id="mc"></div></div>
<script>
let GOALS={},picks=[],S,v=0,cur='',home=true,wordsOpen=true;
const $=s=>document.querySelector(s);
const N=s=>s.toUpperCase().replace(/Ñ/g,'#').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/#/g,'Ñ');
const D=new Map(),P={},fn=k=>k.toLowerCase().replace(/ñ/g,'0');
const Q=new URLSearchParams(location.search),TEST=Q.has('fecha')||Q.has('par'),SK=TEST?'pdl-test':'pdl';
let d=new Date();if(Q.has('fecha')){const t=Q.get('fecha').split('-').map(Number);if(t.length==3&&t.every(Number.isFinite))d=new Date(t[0],t[1]-1,t[2])}
const DK=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const dn=(y,m,x)=>Date.UTC(y,m-1,x)/864e5,hs=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return h};
function perm(L,seed){let a=seed>>>0;const r=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};const p=[...Array(L).keys()];for(let i=L-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p}
function cyc(L,start,c){let q=perm(L,hs(start+':0'));for(let i=1;i<=c;i++){const bad=new Set(q.slice(-Math.floor(L/3)));q=perm(L,hs(start+':'+i));q=[...q.filter(x=>!bad.has(x)),...q.filter(x=>bad.has(x))]}return q}
function schedule(m,date){const T=dn(date.getFullYear(),date.getMonth()+1,date.getDate());let se=m.seasons[0];for(const s of m.seasons)if(dn(...s.start.split('-').map(Number))<=T)se=s;
 const L=se.pairs.length,di=Math.max(0,T-dn(...se.start.split('-').map(Number)));
 return [0,1,2].map(r=>{const p=di*3+r;return se.pairs[cyc(L,se.start,Math.floor(p/L))[p%L]]})}
async function load(){const m=await(await fetch('data/manifest.json')).json();GOALS=m.goals||{};picks=schedule(m,d);if(Q.has('par'))Q.get('par').toUpperCase().split(',').slice(0,3).forEach((k,i)=>{if(/^[A-ZÑ]-[A-ZÑ]$/.test(k))picks[i]=k});
 const fs=await Promise.all(picks.map(async k=>(await fetch('data/'+fn(k)+'.json')).json()));
 fs.forEach(f=>{P[f.k]=[];const U=new Set(f.u?f.u.toUpperCase().split(' '):[]);for(const b of['c','m','r'])if(f[b])f[b].split(' ').forEach(x=>{const w=x.toUpperCase(),R=b=='r'&&!U.has(w),o={w,n:w,r:R,b,p:(w.length-3)*(R?2:1),k:f.k};D.set(w,o);P[f.k].push(o)})})}
const GO=i=>GOALS[picks[i]]||30,save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const tot=i=>S.r[i].f.reduce((a,n)=>a+D.get(n).p,0);
function boot(){if(TEST)home=false;try{S=JSON.parse(localStorage.getItem(SK))}catch(e){}
 if(!S||S.d!==DK||(TEST&&S.t!==picks.join()))S={d:DK,t:picks.join(),r:picks.map(()=>({f:[],x:0}))};
 v=S.r.every(r=>r.x)?3:Math.max(0,S.r.findIndex(r=>!r.x));render()}
const TIERS=['Aprendiz','Buen comienzo','¡Genial!','¡Perfeccionista!'];
const tier=()=>S.r.filter(r=>r.x==1).length;
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('s');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('s'),1700)}
function go(i){home=false;v=i;cur='';render()}
function goHome(){home=true;cur='';render();scrollTo(0,0)}
function soon(){toast('Próximamente')}
function next(){const i=S.r.findIndex(r=>!r.x);go(i<0?3:i)}
function nav(){$('#nav').innerHTML=`<button class="tab ho" onclick="goHome()" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>`+picks.map((k,i)=>`<button class="tab ${v==i?'on':''} ${S.r[i].x?'done':''}" onclick="go(${i})">${k}<small class="${S.r[i].x==1?'ck':''}">${S.r[i].x==1?'✓':S.r[i].x?'cerrada':'Ronda '+(i+1)}</small></button>`).join('')+
 `<button class="tab ${v==3?'on':''}" onclick="go(3)">Stats<small>Hoy</small></button><button class="tab" onclick="rules(0)">?<small>Reglas</small></button>`}
function chips(f){return f.map(n=>{const o=D.get(n);return `<span class="chip ${o.r?'r':''}">${o.w}${o.r?' ✦':''}</span>`}).join('')}
function inp(){const e=$('#inp');if(!e)return;if(!cur){e.className='ph';e.textContent='ESCRIBE UNA PALABRA…'}else{e.className='';e.innerHTML='<b>'+cur[0]+'</b>'+cur.slice(1)}}
function game(){const i=v,k=picks[i],r=S.r[i],g=GO(i),t=Math.min(tot(i),g);
 let o=`<div class="pair"><span>${k[0]}</span><i class="arch"></i><span>${k[2]}</span></div><div class="pill">${t} / ${g} pts</div><div class="bar"><i style="width:${t/g*100}%"></i></div>`;
 if(!r.x){o+=`<div id="inp"></div>`}
 else{o+=`<p class="msg">${r.x==1?'¡Ronda completada!':'Ronda cerrada. Palabras que pudiste jugar:'}</p>`;
  if(r.x==2){const m=P[k].filter(x=>!r.f.includes(x.n)&&x.b!='r').sort((a,b)=>b.p-a.p).slice(0,3);o+=`<div class="chips">${m.map(x=>`<span class="chip ${x.r?'r':''}">${x.w} · ${x.p}</span>`).join('')}</div>`}
  o+=`<button class="btn" onclick="next()">${S.r.every(r=>r.x)?'Ver resumen':'Siguiente ronda'}</button>`}
 o+=`<details ${wordsOpen?'open':''} ontoggle="wordsOpen=this.open"><summary>Mis palabras (${r.f.length})</summary><div class="chips">${chips(r.f)}</div></details>`;
 if(!r.x){o+=`<div id="kb">${['QWERTYUIOP','ASDFGHJKLÑ','!ZXCVBNM?'].map(row=>`<div class="row">${[...row].map(c=>c=='!'?'<button class="k w" data-k="ENTER">ENTRAR</button>':c=='?'?'<button class="k w" data-k="BACK" aria-label="Borrar">⌫</button>':`<button class="k" data-k="${c}">${c}</button>`).join('')}</div>`).join('')}</div><button class="link" onclick="giveUp()">Rendirme en esta ronda</button>`}
 $('#v').innerHTML=o;inp()}
function stats(){const rs=S.r,all=rs.flatMap(r=>r.f).map(n=>D.get(n)),n=tier(),W=all.length,fmt=x=>x.toFixed(1).replace('.',',');
 const by=(f)=>[...all].sort(f)[0],lg=by((a,b)=>b.n.length-a.n.length||b.p-a.p),bs=by((a,b)=>b.p-a.p),ra=all.filter(x=>x.r).sort((a,b)=>b.p-a.p)[0],
  rr=all.filter(x=>x.r&&x!==lg).sort((a,b)=>b.p-a.p)[0]||ra,
  br=picks.map((k,i)=>({k,t:tot(i),n:rs[i].f.length})).filter(x=>x.n).sort((a,b)=>b.t-a.t)[0];
 const usual=picks.reduce((a,k)=>a+P[k].filter(x=>x.b!='r').length,0),found=all.filter(x=>x.b!='r').length,open=rs.findIndex(r=>!r.x),fin=open<0;
 const L=[];
 if(!W)L.push('Todavía no has cavado nada hoy. Elige una ronda y encuentra tu primera palabra.');
 else{L.push(`${fin?'Encontraste':'Llevas'} <b>${W}</b> palabra${W>1?'s':''} en ${rs.filter(r=>r.f.length).length} ronda${rs.filter(r=>r.f.length).length>1?'s':''}. Tu mejor hallazgo es <b>${bs.w}</b>, con ${bs.p} puntos.`);
  L.push(ra?`<b>${ra.w}</b> ✦ es una palabra rara: muy poca gente la escribe, y vale el doble.`:'Aún sin palabras raras ✦. Las poco usadas valen el doble.');
  L.push(`Tus palabras miden ${fmt(all.reduce((a,x)=>a+x.n.length,0)/W)} letras de media y has encontrado ${found} de las ${usual} palabras habituales de tus pares.`);
  if(!fin)L.push(`Te faltan ${GO(open)-Math.min(tot(open),GO(open))} puntos para cerrar ${picks[open]}.`);
  else L.push(n==3?'Tres rondas completas: has cavado el día entero.':n==0?'Hoy has cerrado las tres rondas sin completarlas. Mañana, nuevos pares.':`Completaste ${n} de 3 rondas y cerraste el resto. Mañana, nuevos pares.`)}
 let o=`<h2>${TIERS[n]}</h2><p class="sub">${n} de 3 rondas completadas</p><div class="seg">${rs.map(r=>`<i class="${r.x==1?'on':''}"></i>`).join('')}</div>
 <div class="insight">${L.map(l=>`<p>${l}</p>`).join('')}</div>
 <h3>Tus destacadas</h3><div class="hl"><div><small>Más larga</small>${lg?lg.w:'—'}</div><div><small>Más rara ✦</small>${rr?rr.w:'—'}</div><div><small>Mejor ronda</small>${br?br.k+' · '+br.t+' pts':'—'}</div></div>
 <h3>Progreso por ronda</h3>${picks.map((k,i)=>{const t=Math.min(tot(i),GO(i));return `<div class="rr"><span>${k}</span><div class="bar"><i style="width:${t/GO(i)*100}%"></i></div><span>${t} / ${GO(i)}</span></div>`}).join('')}
 <button class="btn" onclick="share()">Compartir resultados</button>`;
 if(fin){const got=new Set(rs.flatMap(r=>r.f)),miss=picks.flatMap(k=>P[k].filter(x=>x.b!='r'&&!got.has(x.n))).sort((a,b)=>b.p-a.p).slice(0,6);
  if(miss.length)o+=`<h3>Palabras que se te escaparon</h3><div class="chips">${miss.map(x=>`<span class="chip">${x.w} · ${x.p}</span>`).join('')}</div>`}
 o+=`<h3>Tus palabras por ronda</h3>`+picks.map((k,i)=>`<details><summary style="display:flex;justify-content:space-between"><span>${rs[i].x==1?'⭐ ':''}${k}</span><span>${rs[i].f.length} palabras</span></summary><div class="chips">${chips(rs[i].f)||'<span class="msg">Sin palabras todavía</span>'}</div></details>`).join('');
 o+=`<p class="msg">Próximo puzle en <b id="cd"></b></p>`;$('#v').innerHTML=o;tick()}
function tick(){const e=$('#cd');if(!e)return;const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.floor((m-n)/1000),p=x=>String(x).padStart(2,'0');e.textContent=p(s/3600|0)+':'+p(s/60%60|0)+':'+p(s%60)}
setInterval(tick,1000);
function share(){const t=`Pala y Bra ${DK}\n`+picks.map((k,i)=>`${k} ${S.r[i].x==1?'⭐':'▫️'} ${tot(i)} pts`).join('\n')+`\n${TIERS[tier()]}\nhttps://tiborio.github.io/pala-y-bra/`;
 try{navigator.clipboard.writeText(t).then(()=>toast('Resultados copiados'),()=>toast(t))}catch(e){toast('No se pudo copiar')}}
function giveUp(){S.r[v].x=2;save();render()}

function homeView(){$('#nav').innerHTML='';
 const done=S.r.every(r=>r.x),started=S.r.some(r=>r.f.length||r.x),c=S.r.filter(r=>r.x==1).length,
 dt=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}),
 ic=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
 $('#v').innerHTML=`<button class="hrules" onclick="rules(0)" aria-label="Reglas">?</button><div class="home">${LOGO}<h1>Pala <i>y</i> Bra</h1><p class="tag">Cava la palabra que une las dos letras</p>
 <div class="daily"><div class="today" aria-label="Pares de hoy">${picks.map(k=>`<span>${k[0]} · ${k[2]}</span>`).join('')}</div>
 <button class="btn" onclick="play()">${done?'Ver resultados de hoy':started?'Seguir el diario':'Jugar el diario'}</button>
 <p class="st">${c} de 3 rondas completadas</p></div>
 <div class="menu">
 <button class="tile" onclick="soon()">${ic('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>')}Archivo<small>Días pasados</small><em>Pronto</em></button>
 <button class="tile" onclick="soon()">${ic('<path d="M5 20V10M12 20V4M19 20v-7"/>')}Estadísticas<small>Tu historial</small><em>Pronto</em></button>

 <div class="date">${dt}</div></div>`}
function play(){home=false;if(S.r.every(r=>r.x))v=3;render()}
function render(){if(home){homeView();return}nav();v==3?stats():game()}
function sub(){const r=S.r[v],k=picks[v],w=cur;let m='';
 if(w.length<4)m='Mínimo 4 letras';
 else if(w[0]!=k[0]||w[w.length-1]!=k[2])m=`Debe empezar con ${k[0]} y terminar con ${k[2]}`;
 else if(r.f.includes(w))m='Ya la tienes';
 else if(!D.has(w))m='No está en el diccionario';
 if(m)return toast(m);
 r.f.push(w);cur='';toast('+'+D.get(w).p+' pts'+(D.get(w).r?' ✦':''));
 if(tot(v)>=GO(v)){r.x=1;save();render();setTimeout(()=>{if(!home&&S.r[v]===r&&v<3&&S.r.some(q=>!q.x))next()},1600)}else{save();render()}}
function key(c){if(home){if(c=='ENTER')play();return}if(v>2||S.r[v].x)return;if(c=='ENTER')sub();else if(c=='BACK'){cur=cur.slice(0,-1);inp()}else if(cur.length<20){cur+=c;inp()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)});
addEventListener('keydown',e=>{if($('#m').classList.contains('open')||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key=='Enter'){if(document.activeElement.tagName=='BUTTON')return;key('ENTER')}else if(e.key=='Backspace')key('BACK');else if(/^[a-zñáéíóúü]$/i.test(e.key))key(N(e.key))});
const RL=[['Une las letras','Cada palabra debe empezar y terminar con las letras de hoy. Las tildes no importan, y valen plurales, femeninos y verbos conjugados.'],
['Más larga, más puntos','Mínimo 4 letras. Cuanto más larga la palabra, más puntos. Las palabras raras ✦ valen el doble.'],
['Sin nombres propios','No valen nombres propios ni gentilicios de países, ciudades o regiones, como «danés» o «parisino». Sí valen las palabras con otro significado, como «gato» o «canario».'],
['Sube a Perfeccionista','Alcanza la meta en las 3 rondas para llegar al nivel más alto.'],
['¿Atascado? Ríndete','Cierra la ronda para asegurar tus puntos y ver palabras que podías jugar.']];
function rules(i){const m=$('#m');m.classList.add('open');
 $('#mc').innerHTML=`<button class="x" aria-label="Cerrar" onclick="$('#m').classList.remove('open')">✕</button><h3>${RL[i][0]}</h3><p>${RL[i][1]}</p>
 <div class="nv">${i?`<button aria-label="Anterior" onclick="rules(${i-1})">←</button>`:'<span></span>'}<span class="dots">${RL.map((_,j)=>`<i class="${j==i?'on':''}"></i>`).join('')}</span>${i<RL.length-1?`<button aria-label="Siguiente" onclick="rules(${i+1})">→</button>`:`<button onclick="$('#m').classList.remove('open')">${home?'Entendido':'Jugar'}</button>`}</div>`}
load().then(boot).catch(()=>{$('#v').innerHTML='<p class="msg">No se pudieron cargar los datos. Abre el juego desde un servidor (por ejemplo: python -m http.server), no con doble clic.</p>'});
